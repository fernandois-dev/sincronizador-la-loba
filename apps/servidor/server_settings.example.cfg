# Copia este archivo como server_settings.cfg (que NO se sube a git) y completa los valores.

[SERVER]
fastapi_port = 3555

[REPORTES]
reporte_bajo_stock_activo = false

[ODOO]
url = https://TU-EMPRESA.odoo.com/
db = TU-BASE
username = 
password = 

[GOOGLE]
; IDs de las planillas (lo que va entre /d/ y /edit en el enlace) y de la carpeta de Drive.
; La cuenta de servicio de credentials.json debe tener acceso a cada una.
tabla_base =
principal =
gestor =
propuesta_compras =
correlativos =
conteo =
; carpeta de Drive con un archivo por proveedor (órdenes de compra)
carpeta_proveedores =

[EMPRESA]
; datos que aparecen en las órdenes de compra
nombre = Mi Ferretería
ciudad = Ciudad, Chile
correo = contacto@ejemplo.cl

[IMPRESORA]
nombre = zebra


[MERCADOLIBRE]
; carpeta compartida de Drive con las fotos (REF-1.jpg, REF-2.jpg...)
carpeta_fotos_id = 
tipo_publicacion = gold_special
stock_reserva = 0
; estilo por defecto de las descripciones con IA: comercial (con usos típicos) o datos (solo datos conocidos)
descripcion_ia = comercial

[MERCADOLIBRE_CATEGORIAS]
; pestaña de la Tabla Base = categoría ML (cuando el predictor se equivoca)

[MERCADOLIBRE_COLUMNAS]
; set estándar de columnas por categoría ML: Dato[=valor por defecto], separados por coma.
; Cada dato se agrega a la pestaña como columna "<DATO> ML" con: python scripts/ml_columnas_categoria.py "<pestaña>"
MLC1642 = Forma=Rectangular, Material del relleno=Espuma, Formato de venta=Unidad, Cantidad de paquetes=1, Largo, Ancho, Color principal
